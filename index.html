  <body>
    <!-- Unicorn Studio Background -->
    <div 
      id="unicorn-bg" 
      data-us-project="7WRlj4TRuUxuldc6GVDM" 
      style="position: fixed; inset: 0; z-index: -10; pointer-events: none;"
    ></div>
    
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // WebGL background: only LOAD unicornstudio on capable, desktop-class
      // devices that haven't asked for reduced motion. Gated devices never
      // fetch the script at all — they keep the static dark base (#0a0a0a
      // body) + the DOM grid texture, which render on their own. Once
      // loaded, unicornstudio pauses itself on visibilitychange (it cancels
      // its rAF loop when the tab is hidden) and skips rendering when its
      // scene is out of view.
      (function () {
        var shouldLoadWebGL =
          !window.matchMedia('(prefers-reduced-motion: reduce)').matches &&
          window.innerWidth >= 768 &&
          ((navigator.hardwareConcurrency || 8) > 4);

        if (!shouldLoadWebGL) return;

        var script = document.createElement('script');
        script.src = 'https://cdn.jsdelivr.net/gh/hiunicornstudio/unicornstudio.js@v1.4.29/dist/unicornStudio.umd.js';
        script.onload = function () {
          if (window.UnicornStudio && document.getElementById('unicorn-bg')) {
            window.UnicornStudio.init();
          }
        };
        document.head.appendChild(script);
      })();
    </script>
    
    <!-- Sequence animation on scroll -->
    <script>
      (function () {
        const style = document.createElement("style");
        style.textContent = `
          .animate-on-scroll { animation-play-state: paused !important; }
          .animate-on-scroll.animate { animation-play-state: running !important; }
        `;
        document.head.appendChild(style);

        const once = true;

        if (!window.__inViewIO) {
          window.__inViewIO = new IntersectionObserver((entries) => {
            entries.forEach((entry) => {
              if (entry.isIntersecting) {
                entry.target.classList.add("animate");
                if (once) window.__inViewIO.unobserve(entry.target);
              }
            });
          }, { threshold: 0.2, rootMargin: "0px 0px -10% 0px" });
        }

        window.initInViewAnimations = function (selector = ".animate-on-scroll") {
          document.querySelectorAll(selector).forEach((el) => {
            window.__inViewIO.observe(el);
          });
        };

        document.addEventListener("DOMContentLoaded", () => initInViewAnimations());
      })();
    </script>
  </body>
